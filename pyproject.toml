[project]
name = "halden-fdpm-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "faker>=40.63.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "jsonschema>=4.26.0",
    "openai>=3.3.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
halden-fdpm-lab = "halden_fdpm_lab:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
